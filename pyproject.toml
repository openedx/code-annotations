[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "code-annotations"
dynamic = ["version"]
description = "Extensible tools for parsing annotations in codebases"
readme = "README.rst"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=7.0",
    "Jinja2>=3.0",
    "PyYAML>=5.1",
    "python-slugify>=4.0",
    "stevedore>=1.28",
]

[project.optional-dependencies]
django = ["Django>=4.2"]

[project.scripts]
code_annotations = "code_annotations.cli:entry_point"

[project.entry-points."annotation_finder.searchers"]
javascript = "code_annotations.extensions.javascript:JavascriptAnnotationExtension"
python = "code_annotations.extensions.python:PythonAnnotationExtension"

[project.urls]
Homepage = "https://github.com/openedx/code-annotations"

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
include = ["code_annotations*"]

[tool.setuptools.package-data]
"code_annotations" = [
    "report_templates/**",
    "contrib/config/*.yaml",
]

[tool.semantic_release]
build_command = "python -m pip install --upgrade build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = ".. changelog-insertion-marker"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.rst"
output_format = "rst"

[tool.uv]
package = true

[tool.isort]
indent = "    "
line_length = 120
multi_line_output = 3
known_first_party = ["code_annotations"]

[tool.coverage.run]
branch = true
source = ["code_annotations"]
omit = [
    "test_settings",
    "code_annotations/extensions/tests/python_test_files/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

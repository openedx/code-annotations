[tox]
requires = tox-uv>=1
envlist = py{312}-django{42,52}

[doc8]
ignore = D001

[pycodestyle]
exclude = .git,.tox
max-line-length = 120

[pydocstyle]
ignore = D101,D200,D203,D212,D215,D404,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414

[pytest]
addopts = --cov code_annotations --cov-report term-missing --cov-report xml
norecursedirs = .* docs requirements

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands =
    python -Wd -m pytest {posargs}

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = doc
setenv =
    PYTHONPATH = {toxinidir}
allowlist_externals =
    make
    rm
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/code_annotations.rst
    rm -f docs/modules.rst
    make -C docs clean
    make -C docs html

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals =
    make
commands =
    pylint src/code_annotations tests test_utils
    pycodestyle src/code_annotations tests
    pydocstyle src/code_annotations tests
    isort --check-only --diff tests test_utils src/code_annotations
    make selfcheck
